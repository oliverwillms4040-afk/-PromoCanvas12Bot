[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "pip install --upgrade pip",
    "pip install python-telegram-bot==20.7",
    "pip install python-dotenv==1.0.0",
    "pip install Pillow==10.1.0",
    "pip install requests==2.31.0",
    "pip install aiohttp==3.9.0"
]

[start]
cmd = "python bot.py"
